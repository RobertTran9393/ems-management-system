version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ems_postgres
    restart: always
    environment:
      POSTGRES_USER: ems_user
      POSTGRES_PASSWORD: ems_password
      POSTGRES_DB: ems_db
    ports:
      - '5432:5432'
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
    networks:
      - ems_network

  # 2. Backend API Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: postgres://ems_user:ems_password@postgres:5432/ems_db?schema=public
      NODE_ENV: production
    ports:
      - '8000:8000'
    volumes:
      - ems_uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - ems_network

  # 3. Frontend Web Client (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ems_frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - ems_network

volumes:
  ems_pgdata:
  ems_uploads:

networks:
  ems_network:
    driver: bridge
