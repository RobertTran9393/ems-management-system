version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ems_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_password}
      POSTGRES_DB: ${POSTGRES_DB:-ems_db}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
    networks:
      - ems_network

  # 2. Backend API Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://ems_user:ems_password@postgres:5432/ems_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-ems_jwt_super_secret_key_change_me_2026}
      VIETQR_BANK_ID: ${VIETQR_BANK_ID:-970422}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-123456789}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-TRUNG TAM TOAN TRI TUE SBR}
      NODE_ENV: production
    ports:
      - '8000:8000'
    volumes:
      - ems_uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - ems_network

  # 3. Frontend Web Client (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: ems_frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - ems_network

volumes:
  ems_pgdata:
  ems_uploads:

networks:
  ems_network:
    driver: bridge
