services:
  # Backend Web Service (Node.js)
  - type: web
    name: ems-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node prisma/dist/seed.js && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ems-postgres
          property: connectionString

  # Frontend Static Site (React Vite)
  - type: web
    name: ems-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ems-backend
          property: host

databases:
  - name: ems-postgres
    databaseName: ems_db
    user: ems_user
    plan: free
